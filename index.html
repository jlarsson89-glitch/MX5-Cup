<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MX-5 Cup Manager v0.1</title>
<style>
:root{--bg:#0b0e12;--panel:#141922;--panel2:#1b2230;--line:#2b3546;--text:#edf2f7;--muted:#95a2b5;--accent:#e23b32;--good:#58c98d;--warn:#f0b35a;--blue:#69a9ff}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#090b0f,#111722);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit}.app{max-width:1280px;margin:auto;min-height:100vh}.top{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#0c1016dd;position:sticky;top:0;z-index:5}
.brand{font-weight:900;letter-spacing:.08em}.brand b{color:var(--accent)}.tag{font-size:12px;color:var(--muted)}
nav{display:flex;gap:7px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:#10151d}
nav button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:8px;cursor:pointer}
nav button.active,.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.btn.good{background:#183d2b;border-color:#286447}.btn:disabled{opacity:.45;cursor:not-allowed}
main{padding:22px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:linear-gradient(180deg,var(--panel),#11161e);border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:0 10px 28px #0003}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}
h1,h2,h3{margin:0 0 12px} h1{font-size:28px}h2{font-size:19px}.muted{color:var(--muted)}.big{font-size:31px;font-weight:850}.money{color:var(--good)}.warn{color:var(--warn)}.red{color:#ff766f}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #242d3b}.row:last-child{border:0}.bar{height:8px;background:#252e3b;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;color:#cbd5e1}.badge.red{border-color:#75332e;color:#ff9a93}.badge.green{border-color:#295c42;color:#7ee0a7}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #27303e;text-align:left}th{color:var(--muted);font-size:12px;text-transform:uppercase}.you{background:#37221f}
.hero{padding:28px;background:radial-gradient(circle at 80% 20%,#65251f 0,#191c24 37%,#11161e 72%);border:1px solid var(--line);border-radius:14px;margin-bottom:15px}.hero p{max-width:700px;color:#c0c9d6}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice button{text-align:left;padding:18px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);cursor:pointer}.choice button:hover{border-color:#69768a}.choice strong{display:block;font-size:16px;margin-bottom:4px}
.event{padding:12px;border-left:3px solid var(--blue);background:#18202c;margin:8px 0;border-radius:5px}.event.hot{border-color:var(--accent)}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
input{background:#0e131a;color:white;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}.setup{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.span4,.span5,.span6,.span7,.span8{grid-column:span 12}.choice,.setup{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}

.livegap{font-variant-numeric:tabular-nums}.decision{border:1px solid #a33;padding:14px;border-radius:12px;margin:12px 0;background:#1b1111}
.flag{font-weight:800;letter-spacing:.08em}.yellow{color:#ffd35a}.green{color:#71e38a}
.smallbtn{padding:6px 9px;font-size:.82rem}.newsgrid{display:grid;gap:10px}
</style>
</head>
<body><div class="app">
<header class="top"><div><div class="brand"><b>MX-5</b> CUP MANAGER</div><div class="tag">Svensk klubbracing • v0.1</div></div><div id="date"></div></header>
<nav id="nav"></nav><main id="main"></main>
</div>
<script>
const D={
Standard:[["59","Maximilian Egfors",93],["33","Brian Sexton",92],["23","Per Molin",91],["28","Kristoffer Hagström",87],["29","Christoffer Pil",86],["61","Moltas Pernvall",84],["67","Hans Drangel",83],["78","Thomas Pihl",80],["32","Ellie Brismar",79],["68","Jan-Olof Karlsson",78],["92","Christer Lindén",78],["62","Lukas Hultqvist",78],["19","Markus Lefors",77],["13","Oscar Kärrqvist",76],["38","Joacim Almroth",73],["777","Rikard Niva",74]],
Modified:[["42","David Malmberg",92],["43","Martin Ling",91],["81","Jonas Wenklo",91],["22","David Stomberg",90],["27","Johan Larsson",86],["70","Edvin Olsson",84],["72","Fredrik Nordlander",80],["88","Kari Hautakangas",80],["65","Ulf Wärnberg",78],["64","Anders Söderlund",78],["3","Rasmus Raag Löfqvist",80],["55","Lars Hultman",76],["35","Albin Olsson",78],["75","Petter Sångberg",77],["85","Lars Olsson",76],["47","Lars Lastein",75],["46","Stefan Winquist",75]]
};
const CAL=[
["Anderstorp","1–3 maj","Snabb • stabilitet viktig",16],
["Rudskogen","12–14 juni","Flyt • mod belönas",15],
["Ring Knutstorp","3–5 juli","Teknisk • svårt att köra om",17],
["Mantorp Park","28–30 augusti","Motor • bromsar • omkörning",16]
],PTS=[45,41,37,33,30,27,24,21,19,17,15,13,11,9,7,5,3,1];
const traits=["Iskall","Stark starter","Sen bromsare","Jämn","Regnspecialist","Defensiv","Kvalspecialist","Aggressiv"];
const fresh=()=>({started:false,name:"Jakob",team:"Jakob Racing",cls:"Standard",cash:175000,privateCash:30000,rep:8,driver:68,confidence:54,energy:100,event:0,raceNo:0,week:0,license:false,membership:false,safety:false,entered:false,session:null,weather:null,setup:{balance:50,pressure:50},car:{condition:91,motor:82,chassis:84,brakes:78,reliability:90},parts:{engine:92,gearbox:94,brakes:84,suspension:91,drivetrain:93,body:100},tires:[100,100],champ:{Standard:{},Modified:{}},stats:{starts:0,wins:0,podiums:0,poles:0,dnf:0,best:99,modifiedBeaten:0,incidents:0,costs:0},history:[],log:[],sponsor:null,relations:{},rivals:{},news:[],season:2027,market:[],milestones:["Första race"],activities:3});
let s=JSON.parse(localStorage.getItem("mx5cm_save_v03")||"null")||fresh(),tab=s.started?"garage":"start",live=null;
function save(){localStorage.setItem("mx5cm_save_v03",JSON.stringify(s))}
const m=n=>n.toLocaleString("sv-SE")+" kr", clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function bar(v){return `<div class="bar"><i style="width:${clamp(v,0,100)}%"></i></div>`}
function navR(){let a=[["garage","Garage"],["calendar","Kalender"],["drivers","Förare"],["championship","Mästerskap"],["economy","Ekonomi"],["stats","Statistik"],["world","Racingvärlden"]];nav.innerHTML=a.map(x=>`<button class="${tab==x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join("")}
function render(){date.textContent=s.started?`${s.season||2027} • ${s.event<4?CAL[s.event][0]:"Säsongen klar"}`:"Ny karriär";if(!s.started){nav.innerHTML="";return start()}navR();({garage,calendar:cal,drivers:driverPage,championship:champ,economy:econ,stats:statsPage,world:worldPage,week:weekPage,raceWeekend})[tab]?.();save()}
function start(){main.innerHTML=`<section class="hero"><span class="badge red">v0.9 • RACINGVÄRLDEN</span><h1 style="margin-top:12px">MX-5 Cup Manager</h1><p>Nu med en levande racingvärld: rivaliteter, depånyheter, AI-form, marknad, vinterbeslut och fler konsekvenser mellan tävlingarna.</p></section><div class="grid"><div class="card span6"><h2>Din förare</h2><input id="pn" value="Jakob"><br><br><input id="tn" value="Jakob Racing"></div><div class="card span6"><h2>Välj klass</h2><div class="choice"><button onclick="begin('Standard')"><strong>Standard Cup</strong><span class="muted">Den naturliga vägen in.</span></button><button onclick="begin('Modified')"><strong>Modified Cup</strong><span class="muted">Snabbare och dyrare.</span></button></div></div></div>`}
function begin(c){s=fresh();s.started=true;s.name=pn.value||"Jakob";s.team=tn.value||"Jakob Racing";s.cls=c;if(c==="Modified"){s.cash=210000;s.driver=70;s.car.motor=88;s.car.chassis=88}s.log.unshift("Satsningen är igång.");tab="garage";render()}
function cp(n){return s.champ[s.cls][n]||0}
function garage(){let ev=CAL[s.event],ready=s.membership&&s.license&&s.safety;
main.innerHTML=`<section class="hero"><span class="badge">${s.cls}</span><h1>${s.team}</h1><p>#117 • ${s.name} • ${ev?"Nästa: "+ev[0]:"Säsongen är färdig"}</p><div class="controls">${ev?`${ready&&!s.entered?`<button class="btn good" onclick="enter()">Anmäl ${ev[0]} – 6 500</button>`:""}${s.entered?`<button class="btn primary" onclick="tab='raceWeekend';render()">Åk till banan</button>`:`<button class="btn primary" onclick="tab='week';render()">Planera veckan (${s.activities} aktiviteter)</button>`}`:`<button class="btn primary" onclick="seasonSummary()">Säsongssammanfattning</button>`}</div></section>
<div class="grid"><div class="card span4"><h2>Budget</h2><div class="big money">${m(s.cash)}</div><div class="row"><span>Sponsor</span><b>${s.sponsor?s.sponsor.name:"Ingen"}</b></div><div class="row"><span>Rykte</span><b>${s.rep}/100</b></div></div>
<div class="card span4"><h2>Förare</h2><div class="row"><span>OVR</span><b>${s.driver}</b></div>${bar(s.driver)}<div class="row"><span>Självförtroende</span><b>${s.confidence}%</b></div>${bar(s.confidence)}<div class="row"><span>Energi</span><b>${s.energy}%</b></div>${bar(s.energy)}</div>
<div class="card span4"><h2>Administration</h2>${req("membership","Medlemskap",650)}${req("license","SBF-licens",2200)}${req("safety","Säkerhetsutrustning",12500)}</div>
<div class="card span7"><h2>Komponenter</h2>${part("Motor","engine")}${part("Växellåda","gearbox")}${part("Bromsar","brakes")}${part("Fjädring","suspension")}${part("Drivlina","drivetrain")}${part("Kaross","body")}<div class="controls"><button class="btn" onclick="repair()">Garagekväll – 3 800</button></div></div>
<div class="card span5"><h2>Däcklager • Nankang AR-1</h2>${s.tires.map((x,i)=>`<div class="row"><span>Set ${String.fromCharCode(65+i)}</span><b>${x}%</b></div>${bar(x)}`).join("")}<div class="controls"><button class="btn" onclick="newTires()">Köp nytt set – 6 800</button></div><h2 style="margin-top:18px">Depåsnack</h2>${s.log.slice(0,4).map(x=>`<div class="event">${x}</div>`).join("")}</div>
<div class="card span12"><h2>Milstolpar</h2><span class="badge">${s.stats.starts?"✓":"○"} Första race</span> <span class="badge">${s.stats.best<=10?"✓":"○"} Topp 10</span> <span class="badge">${s.stats.modifiedBeaten?"✓":"○"} Slå Modified</span> <span class="badge">${s.stats.podiums?"✓":"○"} Pallplats</span> <span class="badge">${s.stats.wins?"✓":"○"} Seger</span></div></div>`}
function req(k,n,c){return `<div class="row"><span>${n}</span><b>${s[k]?"✓":`<button class="btn" onclick="buy('${k}',${c})">${m(c)}</button>`}</b></div>`}
function part(n,k){return `<div class="row"><span>${n}</span><b class="${s.parts[k]<55?'warn':''}">${s.parts[k]}%</b></div>${bar(s.parts[k])}`}
function buy(k,c){if(s.cash<c)return alert("För lite pengar.");s.cash-=c;s.stats.costs+=c;s[k]=true;render()}
function repair(){if(s.cash<3800)return;s.cash-=3800;s.stats.costs+=3800;Object.keys(s.parts).forEach(k=>s.parts[k]=clamp(s.parts[k]+8,0,100));s.car.condition=clamp(s.car.condition+6,0,100);s.log.unshift("En lång kväll i garaget gav resultat.");render()}
function newTires(){if(s.cash<6800)return;s.cash-=6800;s.stats.costs+=6800;s.tires.push(100);render()}
function weekPage(){main.innerHTML=`<section class="hero"><span class="badge">${s.activities} VAL KVAR</span><h1>Veckan före ${CAL[s.event][0]}</h1><p>Du hinner inte allt. Välj vad du lägger kvällar och helg på.</p></section><div class="grid">${act("🔧","Garagekväll","Förbättra komponenternas skick.",0,"garage")}${act("🎮","Simulator","Banvana och lite självförtroende.",500,"sim")}${act("🏁","Trackday","Stor förberedelse, men kostar och sliter.",4500,"track")}${act("📞","Sponsorjakt","Chans till nytt sponsoravtal.",0,"sponsor")}${act("🏃","Fysisk träning","Energi och förarförmåga.",0,"fitness")}${act("🛋️","Ledigt","Återhämta energi.",0,"rest")}</div><div class="controls"><button class="btn primary" onclick="tab='garage';render()">Till garaget</button></div>`}
function act(ic,n,d,c,id){return `<div class="card span4"><h2>${ic} ${n}</h2><p class="muted">${d}</p><button class="btn" ${s.activities<=0?"disabled":""} onclick="activity('${id}',${c})">${c?m(c):"Välj"}</button></div>`}
function activity(id,c){if(s.activities<=0||s.cash<c)return;s.activities--;s.cash-=c;s.stats.costs+=c;if(id==="garage")Object.keys(s.parts).forEach(k=>s.parts[k]=clamp(s.parts[k]+4,0,100));if(id==="sim")s.confidence=clamp(s.confidence+4,0,100);if(id==="track"){s.confidence+=7;s.driver=Math.min(95,s.driver+.2);s.parts.brakes-=3;s.tires[0]-=8}if(id==="fitness"){s.energy=100;s.driver=Math.min(95,s.driver+.15)}if(id==="rest")s.energy=100;if(id==="sponsor")sponsorOffer();render()}
function sponsorOffer(){if(s.sponsor){s.log.unshift("Du har redan ett aktivt sponsoravtal.");return}let good=Math.random()<.65;if(good){s.sponsor={name:s.rep>15?"Skåne Motorsport AB":"Lokal Bilservice",base:s.rep>15?18000:8000,bonus:s.rep>15?3500:1500};s.cash+=s.sponsor.base;s.log.unshift(`${s.sponsor.name} går in med ${m(s.sponsor.base)}.`)}else s.log.unshift("Sponsorjakten gav inget den här gången.")}
function enter(){if(s.cash<6500)return;s.cash-=6500;s.stats.costs+=6500;s.entered=true;s.raceNo=0;s.session="practice";s.weather=makeWeather();tab="raceWeekend";render()}
function makeWeather(){let r=Math.random();return r<.22?"Regn":r<.48?"Mulet":"Torrt"}
function field(){let a=[];for(let cls of ["Modified","Standard"])for(let d of D[cls])a.push({num:d[0],n:d[1],cls,skill:d[2],trait:traits[(+d[0]||d[1].length)%traits.length]});a.push({num:"117",n:s.name,cls:s.cls,skill:s.driver,trait:"Du",you:true});return a}
function pace(x,spread=8){let p=x.skill+(x.cls==="Modified"?14:0)+(Math.random()-.5)*spread;if(s.weather==="Regn"){p+=(x.trait==="Regnspecialist"?5:0);p+=(Math.random()-.5)*6}if(x.you){p+=s.car.chassis*.03+s.car.motor*.02+s.confidence*.02+(5-Math.abs(s.setup.balance-50)*.2);p+=(s.weather==="Regn"?2:0)}return p}
function raceWeekend(){if(s.session==="practice")practice();else if(s.session==="qual")qual();else if(s.session==="race")raceIntro();else if(s.session==="live")liveView();else resultView()}
function practice(){let f=field().map(x=>({...x,p:pace(x)})).sort((a,b)=>b.p-a.p),me=f.findIndex(x=>x.you),cf=f.filter(x=>x.cls===s.cls),cm=cf.findIndex(x=>x.you);
main.innerHTML=`<section class="hero"><span class="badge red">${CAL[s.event][0]} • TRÄNING</span><h1>${s.weather==="Regn"?"🌧️":s.weather==="Mulet"?"☁️":"☀️"} ${s.weather}</h1><p>P${me+1} totalt • P${cm+1} ${s.cls}. ${CAL[s.event][2]}.</p></section><div class="grid"><div class="card span7"><h2>Setup</h2><div class="setup"><div>Balans<input type="range" min="35" max="65" value="${s.setup.balance}" oninput="s.setup.balance=+this.value"></div><div>Däcktryck<input type="range" min="35" max="65" value="${s.setup.pressure}" oninput="s.setup.pressure=+this.value"></div></div><div class="controls"><button class="btn primary" onclick="s.session='qual';render()">Till kval</button></div></div><div class="card span5"><h2>Däck</h2><p>Aktivt set: ${s.tires[0]}%</p>${bar(s.tires[0])}<p class="muted">AR-1 används även om det regnar.</p></div></div>`}
function qual(){main.innerHTML=`<section class="hero"><span class="badge red">KVAL</span><h1>${s.weather==="Regn"?"Blött kval":"Dags att sätta tiden"}</h1><p>Attacknivån påverkar både potential och risken för misstag.</p></section><div class="choice"><button onclick="doQual(0)"><strong>Säkert</strong><span class="muted">Ta en tid.</span></button><button onclick="doQual(1)"><strong>Normal</strong><span class="muted">Balans.</span></button><button onclick="doQual(2)"><strong>Maximum</strong><span class="muted">Allt på ett varv.</span></button></div>`}
function doQual(r){let f=field().map(x=>({...x,p:pace(x,7)})),me=f.find(x=>x.you);me.p+=r*1.5;if(r==2&&Math.random()<.22)me.p-=10;f.sort((a,b)=>b.p-a.p);s.qual=f;s.grid=f.findIndex(x=>x.you)+1;s.classGrid=f.filter(x=>x.cls===s.cls).findIndex(x=>x.you)+1;if(s.classGrid===1)s.stats.poles++;s.tires[0]=Math.max(0,s.tires[0]-6);s.session="race";render()}
function raceIntro(){main.innerHTML=`<section class="hero"><span class="badge red">RACE ${s.raceNo+1}</span><h1>Start P${s.grid} • P${s.classGrid} ${s.cls}</h1><p>${s.weather}. ${CAL[s.event][3]} varv. Välj hur hårt du vill köra.</p></section><div class="choice"><button onclick="startRace(0)"><strong>Kontrollerat</strong><span class="muted">Skydda bilen.</span></button><button onclick="startRace(1)"><strong>Normal attack</strong><span class="muted">Välj lägen.</span></button><button onclick="startRace(2)"><strong>Hård attack</strong><span class="muted">Mer risk och slitage.</span></button></div>`}
function startRace(risk){let f=(s.qual||field()).map(x=>({...x,score:pace(x,5),dnf:false}));live={lap:0,laps:CAL[s.event][3],risk,field:f,events:["Starten går!"],finished:false};s.session="live";advanceLaps()}
function advanceLaps(){if(!live||live.finished)return;for(let z=0;z<3&&live.lap<live.laps;z++){live.lap++;for(let x of live.field){if(x.dnf)continue;x.score+=((Math.random()-.5)*2)+(x.trait==="Jämn"?.2:0);if(Math.random()<.004+(s.weather==="Regn"?.004:0)){x.dnf=true;live.events.unshift(`Varv ${live.lap}: ${x.n} bryter med problem.`)}}let me=live.field.find(x=>x.you);if(!me.dnf&&Math.random()<(.008+live.risk*.006+(s.weather==="Regn"?.006:0))){if(Math.random()<.25){me.dnf=true;s.stats.dnf++;live.events.unshift(`Varv ${live.lap}: Du tvingas bryta!`)}else{me.score-=5;s.parts.body-=5;s.stats.incidents++;let near=live.field[Math.max(0,live.field.findIndex(q=>q.you)-1)];if(near&&!near.you){s.rivals[near.n]=clamp((s.rivals[near.n]||0)+12,0,100);s.relations[near.n]=(s.relations[near.n]||0)-8;live.events.unshift(`Varv ${live.lap}: Kontakt med ${near.n}! Rivaliteten ökar.`)}else live.events.unshift(`Varv ${live.lap}: Kontakt! Du tappar tid.`)}}live.field.sort((a,b)=>(a.dnf? -999:a.score)-(b.dnf?-999:b.score)).reverse();if(Math.random()<.35){let mep=live.field.findIndex(x=>x.you);let near=live.field[Math.max(0,mep-1)];if(near&&!near.you)live.events.unshift(`Varv ${live.lap}: Du ligger tätt med ${near.n}.`)}}if(live.lap>=live.laps){live.finished=true;finishRace()}liveView()}
function liveView(){let f=live.field,me=f.findIndex(x=>x.you),cf=f.filter(x=>x.cls===s.cls&&!x.dnf),cm=cf.findIndex(x=>x.you);main.innerHTML=`<section class="hero"><span class="badge red">LIVE • VARV ${live.lap}/${live.laps}</span><h1>${f[me]?.dnf?"DNF":`P${me+1} totalt • P${cm+1} ${s.cls}`}</h1><p>${s.weather==="Regn"?"🌧️ Blött och halt":"🏁 "+s.weather} • Däck ${s.tires[0]}%</p><div class="controls">${!live.finished?`<button class="btn primary" onclick="advanceLaps()">Kör 3 varv</button><button class="btn" onclick="while(!live.finished)advanceLaps()">Kör till mål</button>`:`<button class="btn primary" onclick="s.session='result';render()">Resultat</button>`}</div></section><div class="grid"><div class="card span8"><h2>Live timing</h2>${resultTable(f)}</div><div class="card span4"><h2>Race control</h2>${live.events.slice(0,7).map(x=>`<div class="event ${x.includes("Kontakt")||x.includes("bryter")?"hot":""}">${x}</div>`).join("")}</div></div>`}

// ---- v0.9 race depth / migration ----
function migrateV5(){
  s.v5=s.v5||{};
  s.v5.news=s.v5.news||[];
  s.v5.racecraft=s.v5.racecraft||50;
  s.v5.wet=s.v5.wet||50;
  s.v5.decisions=s.v5.decisions||0;
  s.v5.penalties=s.v5.penalties||0;
  s.v5.fastest=s.v5.fastest||0;
}
migrateV5();

function raceBase(x){
  let p=(x.skill||70)+(x.cls==="Modified"?14:0);
  if(s.weather==="Regn") p+=(x.trait==="Regnspecialist"?5:0)+(Math.random()-.5)*4;
  if(x.you) p+=s.driver*.035+s.confidence*.018+s.car.motor*.018+s.car.chassis*.02;
  return p;
}
function makeLiveV5(risk){
  let f=(s.qual||field()).map((x,i)=>({...x,score:raceBase(x),dnf:false,gap:0,last:0,best:999,pen:0,pos:i+1}));
  live={lap:0,laps:CAL[s.event][3],risk,field:f,events:["🟢 Starten går!"],finished:false,decision:null,sc:0};
  s.session="live";
  advanceV5(1);
}
function incidentChance(x){return .0025+(s.weather==="Regn"?.004:0)+(live.risk*.0015)+(x.trait==="Aggressiv"?.0015:0)}
function lapTime(x){
  let base=72-(x.skill||70)*.075-(x.cls==="Modified"?2.15:0);
  if(s.weather==="Regn") base+=7.5;
  let tyre=(100-s.tires[0])*.012, wear=x.you?(100-(s.parts.brakes+s.parts.suspension+s.parts.drivetrain)/3)*.008:0;
  let noise=(Math.random()-.5)*1.05;
  return base+tyre+wear+noise-(x.you?live.risk*.12:0);
}
function sortTiming(){
  live.field.sort((a,b)=>{
    if(a.dnf!==b.dnf)return a.dnf?1:-1;
    return b.score-a.score;
  });
  let lead=live.field.find(x=>!x.dnf)?.score||0;
  live.field.forEach((x,i)=>{x.pos=i+1;x.gap=x.dnf?999:Math.max(0,(lead-x.score)*.48)});
}
function maybeDecision(){
  let me=live.field.find(x=>x.you); if(!me||me.dnf||live.finished||live.decision)return;
  let i=live.field.indexOf(me), ahead=live.field[i-1], behind=live.field[i+1];
  if(ahead&&!ahead.dnf&&Math.abs(ahead.score-me.score)<2.2&&Math.random()<.48)
    live.decision={type:"attack",other:ahead.n,text:`Du är inom slagläge på ${ahead.n}.`};
  else if(behind&&!behind.dnf&&Math.abs(behind.score-me.score)<2.0&&Math.random()<.34)
    live.decision={type:"defend",other:behind.n,text:`${behind.n} fyller backspeglarna.`};
  else if(s.parts.brakes<48&&Math.random()<.28)
    live.decision={type:"mechanical",other:null,text:"Bromspedalen känns längre än tidigare."};
}
function advanceV5(n=3){
  if(!live||live.finished||live.decision)return;
  for(let z=0;z<n&&live.lap<live.laps;z++){
    live.lap++;
    if(!live.sc && Math.random()<.025 && live.lap>2 && live.lap<live.laps-2){live.sc=2;live.events.unshift(`🟡 Varv ${live.lap}: Safety Car efter en incident längre bak.`)}
    for(let x of live.field){
      if(x.dnf)continue;
      x.last=lapTime(x);x.best=Math.min(x.best,x.last);
      let gain=(74-x.last)*.20+(Math.random()-.5)*.55;
      if(live.sc) gain*=.15;
      x.score+=gain;
      if(!x.you&&Math.random()<incidentChance(x)){
        if(Math.random()<.38){x.dnf=true;live.events.unshift(`Varv ${live.lap}: ${x.n} står vid sidan av banan. DNF.`)}
        else {x.score-=2.5;live.events.unshift(`Varv ${live.lap}: ${x.n} gör ett misstag och tappar.`)}
      }
    }
    let me=live.field.find(x=>x.you);
    if(me&&!me.dnf){
      let fail=.002+live.risk*.0025+(s.weather==="Regn"?.003:0)+(100-s.parts.drivetrain)*.00005;
      if(Math.random()<fail){me.dnf=true;s.stats.dnf++;live.events.unshift(`🔧 Varv ${live.lap}: Du tvingas bryta med tekniskt problem.`)}
    }
    if(live.sc){live.sc--; if(!live.sc)live.events.unshift(`🟢 Varv ${live.lap}: Safety Car in. Grön flagg!`)}
    sortTiming(); maybeDecision(); if(live.decision)break;
  }
  if(live.lap>=live.laps&&!live.finished){live.finished=true;finishRace();v5PostRace()}
  liveViewV5();
}
function chooseV5(kind){
  let d=live.decision,me=live.field.find(x=>x.you),i=live.field.indexOf(me),other=d.type==="attack"?live.field[i-1]:live.field[i+1];
  s.v5.decisions++;
  if(d.type==="attack"){
    let chance={wait:.18,normal:.48,hard:.68}[kind]||.4;
    chance+=(s.driver-70)*.006-(other.skill-75)*.004;
    if(Math.random()<chance){me.score+=2.4;live.events.unshift(`⚔️ Varv ${live.lap}: Du tar dig förbi ${d.other}!`)}
    else if(kind==="hard"&&Math.random()<.28){me.score-=3;s.parts.body=Math.max(20,s.parts.body-7);s.stats.incidents++;live.events.unshift(`💥 Kontakt med ${d.other}! Båda tappar tid.`);relationHit(d.other)}
    else live.events.unshift(`Varv ${live.lap}: ${d.other} håller dig bakom.`)
  }else if(d.type==="defend"){
    let chance={yield:.25,normal:.58,hard:.76}[kind]||.5;
    if(Math.random()<chance){me.score+=.8;live.events.unshift(`🛡️ Du håller ${d.other} bakom dig.`)}
    else {me.score-=2;live.events.unshift(`${d.other} tar sig förbi.`)}
    if(kind==="hard"&&Math.random()<.18){me.pen+=5;s.v5.penalties++;live.events.unshift(`⚖️ Race Control: +5 sekunder för oschysst försvar.`)}
  }else{
    if(kind==="pit"){me.score-=7;s.parts.brakes=Math.min(100,s.parts.brakes+10);live.events.unshift("🔧 Kort depåbesök. Du tappar platser men säkrar bromsarna.")}
    else if(kind==="slow"){live.risk=0;live.events.unshift("Du sänker tempot för att få bilen i mål.")}
    else {live.risk=2;live.events.unshift("Du fortsätter. Förhoppningsvis håller det.")}
  }
  live.decision=null;sortTiming();liveViewV5();
}
function relationHit(name){let v=s.relations[name];if(typeof v!=="number")v=0;s.relations[name]=v-1;s.log.unshift(`Det blev spänt mellan dig och ${name} efter kontakten.`)}
function fmt(t){if(!isFinite(t)||t>=999)return "—";let m=Math.floor(t/60),sec=(t-m*60).toFixed(3).padStart(6,"0");return `${m}:${sec}`}
function liveViewV5(){
  let f=live.field,me=f.find(x=>x.you),active=f.filter(x=>!x.dnf),classActive=active.filter(x=>x.cls===s.cls),cp=me.dnf?"DNF":classActive.indexOf(me)+1;
  let dec="";
  if(live.decision){
    let d=live.decision;
    if(d.type==="attack")dec=`<div class="decision"><h2>⚔️ Chans till omkörning</h2><p>${d.text}</p><div class="controls"><button class="btn" onclick="chooseV5('wait')">Avvakta</button><button class="btn primary" onclick="chooseV5('normal')">Försök</button><button class="btn" onclick="chooseV5('hard')">Kasta in bilen</button></div></div>`;
    if(d.type==="defend")dec=`<div class="decision"><h2>🛡️ Försvara positionen</h2><p>${d.text}</p><div class="controls"><button class="btn" onclick="chooseV5('yield')">Tänk på racet</button><button class="btn primary" onclick="chooseV5('normal')">Försvara</button><button class="btn" onclick="chooseV5('hard')">Stäng dörren</button></div></div>`;
